name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'GitHub repo URL to build'
        required: true
        default: 'https://github.com/termux/termux-app'
      branch:
        description: 'Branch name'
        required: true
        default: 'master'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget https://dl.google.com/android/repository/commandlinetools-linux-latest.zip
          unzip commandlinetools-linux-latest.zip -d $HOME/android-sdk
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/bin:$PATH
          echo "y" | $ANDROID_HOME/cmdline-tools/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/bin/sdkmanager "platform-tools" "platforms;android-30"
      
      - name: Clone target repo
        run: |
          git clone ${{ github.event.inputs.repo_url }} target
          cd target
          git checkout ${{ github.event.inputs.branch }}
      
      - name: Build APK
        run: |
          cd target
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "No gradlew found, looking for build.gradle"
            if [ -f "build.gradle" ]; then
              gradle build
            else
              echo "No build system found"
              exit 1
            fi
          fi
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: built-apk
          path: target/**/*.apk
